<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Classrooms</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">Admin Panel</div>
        <nav class="nav">
            <a href="admin-labs.html">Laboratories</a>
            <a href="admin-classrooms.html" class="active">Classrooms</a>
            <a href="admin-resources.html">Resources</a>
            <a href="admin-conflicts.html">Conflicts</a>
            <a href="dashboard.html">User Dashboard</a>
        </nav>
    </aside>

    <main class="main">
        <div class="topbar">
            <h2>Manage Classrooms</h2>
            <button class="btn">+ Add Classroom</button>
        </div>

        <div class="card">
            <table>
                <tr>
                    <th>Room</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>

                <tr>
                    <td>C305</td>
                    <td>60</td>
                    <td><span class="status available">Active</span></td>
                    <td><button class="btn btn-secondary">Edit</button></td>
                </tr>

                <tr>
                    <td>D210</td>
                    <td>45</td>
                    <td><span class="status booked">Inactive</span></td>
                    <td><button class="btn btn-secondary">Edit</button></td>
                </tr>
            </table>
        </div>
    </main>
</div>
</body>
</html>
