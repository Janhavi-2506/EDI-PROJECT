<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Laboratories</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">Admin Panel</div>
        <nav class="nav">
            <a href="admin-labs.html" class="active">Laboratories</a>
            <a href="admin-classrooms.html">Classrooms</a>
            <a href="admin-resources.html">Resources</a>
            <a href="admin-conflicts.html">Conflicts</a>
            <a href="dashboard.html">User Dashboard</a>
        </nav>
    </aside>

    <main class="main">
        <div class="topbar">
            <h2>Manage Laboratories</h2>
            <button class="btn">+ Add Lab</button>
        </div>

        <div class="card">
            <table>
                <tr>
                    <th>Lab Code</th>
                    <th>Name</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>

                <tr>
                    <td>A101</td>
                    <td>Computer Lab</td>
                    <td>40</td>
                    <td><span class="status available">Active</span></td>
                    <td><button class="btn btn-secondary">Edit</button></td>
                </tr>

                <tr>
                    <td>B203</td>
                    <td>Electronics Lab</td>
                    <td>30</td>
                    <td><span class="status available">Active</span></td>
                    <td><button class="btn btn-secondary">Edit</button></td>
                </tr>
            </table>
        </div>
    </main>
</div>
</body>
</html>
